[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vajra"
version = "0.1.0"
description = "Passive, metadata-only cyber-threat analysis foundation for unidirectional IP traffic."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "joblib>=1.4,<2.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.8,<1.0",
    "scikit-learn>=1.5,<2.0",
]

ml = [
    "joblib>=1.4,<2.0",
    "scikit-learn>=1.5,<2.0",
]

[project.scripts]
vajra = "vajra.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vajra"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]